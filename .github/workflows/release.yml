name: release

# Publishes to Clojars when a v* tag is pushed. The tag is the deliberate
# "this is worth a release" signal; nothing publishes on ordinary commits.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # manual run for testing; publishing remains tag-only

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag matches build.clj version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(sed -n 's/.*def version "\([^"]*\)".*/\1/p' build.clj)
          echo "tag=$TAG build.clj=$PROJ"
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::tag v$TAG does not match build.clj version $PROJ"
            exit 1
          fi

      - name: Verify tag matches project.clj version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(sed -n 's/.*defproject [^ ]* "\([^"]*\)".*/\1/p' project.clj)
          if [ -z "$PROJ" ]; then
            PROJ=$(sed -n 's/.*(def version "\([^"]*\)").*/\1/p' project.clj)
          fi
          echo "tag=$TAG project.clj=$PROJ"
          if [ -z "$PROJ" ] || [ "$TAG" != "$PROJ" ]; then
            echo "::error::tag v$TAG does not match project.clj version $PROJ"
            exit 1
          fi

      - name: Verify README install coordinates match versions
        if: github.ref_type == 'tag'
        run: |
          check () {
            local artifact="$1" dir="$2" ver lib
            ver=$(sed -n 's/.*def version "\([^"]*\)".*/\1/p' "$dir/build.clj")
            lib=$(grep -oE "net\.clojars\.[^ ')]+" "$dir/build.clj" | head -1)
            if ! sed 's/  */ /g' README.md | grep -qF "$lib {:mvn/version \"$ver\"}"; then
              echo "::error::README.md is missing install coordinate: $lib {:mvn/version \"$ver\"}"
              exit 1
            fi
          }
          check psql-clj     .
          check psql-clj-gis modules/gis
          check psql-clj-aws modules/aws

      - name: Verify doc/*.md install coordinates match versions
        if: github.ref_type == 'tag'
        run: |
          rc=0
          check () {
            local dir="$2" ver lib f found
            ver=$(sed -n 's/.*def version "\([^"]*\)".*/\1/p' "$dir/build.clj")
            lib=$(grep -oE "net\.clojars\.[^ ')]+" "$dir/build.clj" | head -1)
            shopt -s nullglob
            for f in doc/*.md; do
              while IFS= read -r found; do
                if [ "$found" != "$ver" ]; then
                  echo "::error file=$f::$f pins $lib {:mvn/version \"$found\"}, expected \"$ver\""
                  rc=1
                fi
              done < <(grep -oE "net\.clojars\.[a-zA-Z0-9._/-]+ \{:mvn/version \"[^\"]+\"\}" "$f" | grep -F "$lib {:mvn/version" | grep -oE '"[^"]+"' | tr -d '"')
            done
          }
          check psql-clj     .
          check psql-clj-gis modules/gis
          check psql-clj-aws modules/aws
          exit $rc

      - name: Verify tag commit is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not an ancestor of origin/main"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PATTERN=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          awk -v p="$PATTERN" '
            $0 ~ "^## \\[" p "\\]" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat release-notes.md

      - name: Upload release notes
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  verify:
    needs: guards
    uses: ./.github/workflows/test-matrix.yml

  release:
    needs: [guards, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-m2-
      - uses: actions/download-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-notes

      # 3-artifact release. Companions declare a :mvn/version dep on core, so core
      # is always installed to ~/.m2 first (companions resolve it). Clojars is
      # immutable: redeploying an already-published non-SNAPSHOT version 403s. So
      # each artifact is deployed only when its build.clj version is not yet on
      # Clojars - a core-only bump, a companion-only bump, and re-running the same
      # tag are all idempotent and stay green instead of failing on a redeploy.
      - name: Deploy core + companions to Clojars
        if: github.ref_type == 'tag'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          set -euo pipefail

          deploy_if_new () {
            local artifact="$1" dir="$2" ver url code
            ver=$(sed -n 's/.*def version "\([^"]*\)".*/\1/p' "$dir/build.clj")
            url="https://repo.clojars.org/net/clojars/savya/${artifact}/${ver}/${artifact}-${ver}.jar"
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then
              echo "::notice::${artifact} ${ver} already on Clojars; skipping"
            else
              echo "Deploying ${artifact} ${ver} (Clojars returned ${code})"
              (cd "$dir" && clojure -T:build deploy)
            fi
          }

          clojure -T:build install          # core -> ~/.m2 (companions resolve this)
          deploy_if_new psql-clj     .
          deploy_if_new psql-clj-gis modules/gis
          deploy_if_new psql-clj-aws modules/aws

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
